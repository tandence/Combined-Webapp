<g id="gold-binding"><path d="M286 249q48-24 100 0-46 31-100 0Z" fill="url(#commitment-gold)" stroke="#9b6d36" stroke-width="3"/><path d="M294 249q44-12 84 0" fill="none" stroke="#fff0c9" stroke-width="3"/><path d="M287 249h98v56h-98Z" fill="url(#commitment-grain)" opacity=".22"/></g>
<g id="tending-hands"><path d="M0 270q113-12 212 18 49 15 88-17" fill="none" stroke="#7895a1" stroke-width="47" stroke-linecap="round"/><path d="M600 270q-113-12-212 18-49 15-88-17" fill="none" stroke="#756787" stroke-width="47" stroke-linecap="round"/><path d="M214 287q49 18 86-16M386 287q-49 18-86-16" fill="none" stroke="#b97d60" stroke-width="18" stroke-linecap="round"/></g>
