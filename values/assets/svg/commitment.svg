<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="commitment-title commitment-desc">
<title id="commitment-title">Commitment</title>
<desc id="commitment-desc">Two hands secure a young tree to a steady support, tending what has been chosen over time.</desc>
<defs>
 <radialGradient id="commitment-halo"><stop stop-color="#f6e5c1"/><stop offset="1" stop-color="#ead4aa" stop-opacity=".14"/></radialGradient>
 <linearGradient id="commitment-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5b790"/><stop offset="1" stop-color="#4e7059"/></linearGradient>
 <linearGradient id="commitment-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efcf7c"/><stop offset="1" stop-color="#b87b30"/></linearGradient>
 <pattern id="commitment-grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#f2d29a" opacity=".42"/></pattern>
</defs>
<rect width="600" height="420" rx="28" fill="#fbf6ed"/><circle cx="300" cy="199" r="154" fill="url(#commitment-halo)"/>
