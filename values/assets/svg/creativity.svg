<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="creativity-title creativity-desc">
<title id="creativity-title">Creativity</title>
<desc id="creativity-desc">An adult makes a painted mark at a welcoming table, with a warm drink and well-used brushes nearby.</desc>
