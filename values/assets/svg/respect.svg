<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="respect-title respect-desc">
<title id="respect-title">Respect</title>
<desc id="respect-desc">Two adults meet one another at equal height, each making room for the other.</desc>
<defs>
 <radialGradient id="respect-halo"><stop stop-color="#f5e5c4"/><stop offset="1" stop-color="#ead5ad" stop-opacity=".15"/></radialGradient>
 <linearGradient id="respect-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c99a5"/><stop offset="1" stop-color="#3c6270"/></linearGradient>
 <linearGradient id="respect-green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#98aa91"/><stop offset="1" stop-color="#55715c"/></linearGradient>
 <linearGradient id="respect-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eecf7e"/><stop offset="1" stop-color="#bb7c30"/></linearGradient>
</defs>
<rect width="600" height="420" rx="28" fill="#fbf6ed"/><circle cx="300" cy="201" r="154" fill="url(#respect-halo)"/>
<g id="person-left"><circle cx="211" cy="154" r="40" fill="#9b6651"/><path d="M173 155c0-45 19-68 49-64 27 4 38 27 29 63-15-8-28-19-40-34-10 16-22 28-38 35Z" fill="#413a3b"/><path d="M119 337q15-130 93-151 78 22 93 151Z" fill="url(#respect-blue)" stroke="#f5eee5" stroke-width="2"/></g>
<g id="person-right"><circle cx="389" cy="154" r="40" fill="#ce9673"/><path d="M351 155c0-44 19-67 48-64 27 3 38 27 29 63-15-8-28-19-40-34-10 16-22 28-37 35Z" fill="#695047"/><path d="M295 337q15-130 94-151 78 22 92 151Z" fill="url(#respect-green)" stroke="#f5eee5" stroke-width="2"/></g>
<g id="equal-space"><path d="M260 232h80" stroke="#d4a34a" stroke-width="5" stroke-linecap="round"/><circle cx="300" cy="232" r="14" fill="url(#respect-gold)"/><path d="M188 191q23 15 46 0M366 191q23 15 46 0" fill="none" stroke="#efd9ce" stroke-width="3" stroke-linecap="round"/></g>
<path d="M79 367h442M119 379h362" fill="none" stroke="#77847a" stroke-width="4" stroke-linecap="round" opacity=".32"/>
</svg>
