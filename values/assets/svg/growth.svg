 <linearGradient id="growth-earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd8c68"/><stop offset="1" stop-color="#805b45"/></linearGradient>
 <pattern id="growth-grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#edcf9d" opacity=".38"/></pattern>
