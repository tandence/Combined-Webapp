 <linearGradient id="purpose-hill-b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fa581"/><stop offset="1" stop-color="#55725c"/></linearGradient>
 <linearGradient id="purpose-path" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1d789"/><stop offset="1" stop-color="#b98d56"/></linearGradient>
 <linearGradient id="purpose-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efd07b"/><stop offset="1" stop-color="#b9792d"/></linearGradient>
