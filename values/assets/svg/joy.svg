<title id="joy-title">Joy</title>
<desc id="joy-desc">An adult lifts their arms into warm light as flowing shapes open around them in an unguarded moment of joy.</desc>
<defs>
 <radialGradient id="joy-halo"><stop stop-color="#f8e4af"/><stop offset="1" stop-color="#ecd2a0" stop-opacity=".1"/></radialGradient>
