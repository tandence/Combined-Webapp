 <linearGradient id="joy-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1d17c"/><stop offset="1" stop-color="#bd7e30"/></linearGradient>
 <pattern id="joy-dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#fff0c9" opacity=".58"/></pattern>
</defs>
