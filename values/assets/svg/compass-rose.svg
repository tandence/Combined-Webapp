<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="compass-title compass-desc">
<title id="compass-title">What Matters Most compass</title>
<desc id="compass-desc">A finely drawn golden compass rose with layered navigation rings and a bright north point.</desc>
<defs>
  <radialGradient id="compass-glow"><stop stop-color="#fff3cf"/><stop offset=".45" stop-color="#e7c47b"/><stop offset="1" stop-color="#9e6e31"/></radialGradient>
  <linearGradient id="compass-needle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e7"/><stop offset=".48" stop-color="#e7c47b"/><stop offset="1" stop-color="#9f7137"/></linearGradient>
</defs>
<g id="navigation-rings" fill="none" stroke="#d9b66c" stroke-linecap="round">
  <circle cx="80" cy="80" r="70" stroke-width="1" opacity=".52"/>
  <circle cx="80" cy="80" r="59" stroke-width="1.2" stroke-dasharray="1 5" opacity=".7"/>
  <circle cx="80" cy="80" r="48" stroke-width="1" opacity=".68"/>
  <circle cx="80" cy="80" r="31" stroke-width="1" opacity=".42"/>
</g>
<g id="bearing-lines" stroke="#d9b66c" stroke-linecap="round">
  <path d="M80 8v18M80 134v18M8 80h18M134 80h18" stroke-width="1.8"/>
  <path d="m29 29 13 13m76 76 13 13m0-102-13 13m-76 76-13 13" stroke-width="1" opacity=".64"/>
  <path d="M80 15v130M15 80h130" stroke-width=".8" opacity=".42"/>
</g>
<g id="cardinal-points" fill="#e8c579"><circle cx="80" cy="8" r="2.4"/><circle cx="80" cy="152" r="2.4"/><circle cx="8" cy="80" r="2.4"/><circle cx="152" cy="80" r="2.4"/></g>
<g id="compass-star" stroke="#745127" stroke-width=".7" stroke-linejoin="round">
  <path d="M80 19 91 68 80 80 69 68Z" fill="url(#compass-needle)"/>
  <path d="m141 80-49 11-12-11 12-11Z" fill="#c99c50"/>
  <path d="m80 141-11-49 11-12 11 12Z" fill="#a97637"/>
  <path d="m19 80 49-11 12 11-12 11Z" fill="#f3dfac"/>
  <path d="m80 48 8 24 24 8-24 8-8 24-8-24-24-8 24-8Z" fill="url(#compass-glow)"/>
</g>
<circle id="centre" cx="80" cy="80" r="5" fill="#fff3ce" stroke="#9c6b2f" stroke-width="1.3"/>
</svg>
