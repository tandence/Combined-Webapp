<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="generosity-title generosity-desc">
<title id="generosity-title">Generosity</title>
<desc id="generosity-desc">One open hand shares a small gathering of seeds with another waiting hand.</desc>
<defs>
 <radialGradient id="generosity-halo"><stop stop-color="#f7e5bd"/><stop offset="1" stop-color="#ead3a7" stop-opacity=".14"/></radialGradient>
 <linearGradient id="generosity-green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94aa91"/><stop offset="1" stop-color="#4d6f59"/></linearGradient>
 <linearGradient id="generosity-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d17f"/><stop offset="1" stop-color="#b87b30"/></linearGradient>
</defs>
<rect width="600" height="420" rx="28" fill="#fbf6ed"/><circle cx="300" cy="198" r="154" fill="url(#generosity-halo)"/>
<g id="giving-hand"><path d="M0 172q97 2 181 57 63 41 121 34" fill="none" stroke="url(#generosity-green)" stroke-width="50" stroke-linecap="round"/><path d="M180 229q63 44 122 34" fill="none" stroke="#a96f55" stroke-width="20" stroke-linecap="round"/><path d="M248 248q30-27 60-5" fill="none" stroke="#a96f55" stroke-width="13" stroke-linecap="round"/></g>
<g id="receiving-hand"><path d="M600 294q-110-15-210 21-54 19-96 7" fill="none" stroke="#7896a3" stroke-width="50" stroke-linecap="round"/><path d="M391 315q-55 27-104 6" fill="none" stroke="#cf9774" stroke-width="20" stroke-linecap="round"/><path d="M344 302q-34-19-62 2" fill="none" stroke="#cf9774" stroke-width="13" stroke-linecap="round"/></g>
<g id="shared-seeds" fill="url(#generosity-gold)"><ellipse cx="274" cy="210" rx="9" ry="13" transform="rotate(-25 274 210)"/><ellipse cx="305" cy="194" rx="9" ry="13" transform="rotate(18 305 194)"/><ellipse cx="332" cy="217" rx="8" ry="12" transform="rotate(32 332 217)"/><circle cx="300" cy="158" r="15"/><path d="M300 173v31" stroke="#5c785f" stroke-width="5" stroke-linecap="round"/></g>
<path d="M88 367c86-18 154-16 212 1 64 19 134 17 212-5" fill="none" stroke="#6d816f" stroke-width="5" stroke-linecap="round" opacity=".32"/>
</svg>
