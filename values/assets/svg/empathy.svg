<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="empathy-title empathy-desc">
<title id="empathy-title">Empathy</title>
<desc id="empathy-desc">Two adults sit close in quiet conversation, one turning fully toward the other to listen.</desc>
<defs>
