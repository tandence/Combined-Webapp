<g id="shared-attention"><path d="M289 235q10-25 28 0 17-25 28 0-4 30-28 44-24-14-28-44Z" fill="url(#empathy-gold)" opacity=".9"/><path d="M109 360c86-19 153-17 191 0 51 22 116 20 191-4" fill="none" stroke="#67858b" stroke-width="5" stroke-linecap="round" opacity=".34"/></g>
