 <linearGradient id="empathy-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9c873"/><stop offset="1" stop-color="#b77a31"/></linearGradient>
 <linearGradient id="empathy-rust" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cf8967"/><stop offset="1" stop-color="#96513f"/></linearGradient>
</defs>
<rect width="600" height="420" rx="28" fill="#fbf6ed"/><circle cx="300" cy="201" r="154" fill="url(#empathy-halo)"/>
